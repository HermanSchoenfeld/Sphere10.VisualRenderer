name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_ACTIONS: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build ./Sphere10.VisualRenderer.sln --configuration Debug --verbosity minimal -p:BuildRevision=${{ github.run_number }}
      - name: Run unit tests
        run: >-
          dotnet test ./tests/Sphere10.VisualRenderer.Tests/Sphere10.VisualRenderer.Tests.csproj
          --configuration Debug
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
