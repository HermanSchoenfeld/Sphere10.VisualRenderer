<figure id="{object_id}" class="ln-mermaid" data-ln-mermaid data-ln-mermaid-state="pending">
    <div class="ln-mermaid-diagram" role="img" aria-label="Mermaid diagram"></div>
    <p class="ln-mermaid-error" role="alert" hidden></p>
    <details class="ln-mermaid-source" open>
        <summary>Diagram source</summary>
        <pre><code>{code}</code></pre>
    </details>
    <figcaption>{caption}</figcaption>
</figure>
{runtime}
